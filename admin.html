<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پنل مدیریت چت پلاس</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0a0a1f; --card: #16162e; --border: #2a2a52;
            --primary: #7c5cff; --text: #ffffff; --text-2: #b8b8d8; --red: #ef4444; --green: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 20px; }
        
        /* Login Screen */
        #login-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 100; }
        .login-box { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; border: 1px solid var(--border); }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid var(--border); background: #0a0a1f; color: white; outline: none; text-align: center; letter-spacing: 2px; }
        .login-box button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--primary); color: white; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* Header */
        header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        header h1 { font-size: 18px; font-weight: 800; color: var(--primary); }
        
        /* Tabs */
        .tabs { display: flex; padding: 10px; gap: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text-2); border-radius: 10px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Lists */
        .section { padding: 10px 15px; display: none; }
        .section.active { display: block; }
        
        .row-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .user-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; background-size: cover; background-position: center; }
        .user-info h3 { font-size: 14px; }
        .user-info p { font-size: 12px; color: var(--text-2); }
        
        .actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .actions button { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #1e1e3f; color: white; font-size: 12px; cursor: pointer; }
        .actions button.danger { background: rgba(239,68,68,0.2); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
        .actions button.green { background: rgba(34,197,94,0.2); color: #86efac; border-color: rgba(34,197,94,0.3); }
        
        .report-card { background: var(--card); border: 1px solid var(--red); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .report-names { font-size: 13px; font-weight: bold; margin-bottom: 5px; line-height: 1.6; }
        .report-reason { font-size: 12px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; color: var(--text-2); }
        .report-time { font-size: 10px; color: var(--text-2); margin-top: 8px; text-align: left; }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 5px;">پنل مدیریت</h2>
            <p style="font-size: 12px; color: var(--text-2);">فقط برای مدیر سیستم</p>
            <input type="password" id="admin-pass" placeholder="رمز عبور را وارد کنید">
            <button onclick="login()">ورود به پنل</button>
        </div>
    </div>

    <!-- محتوای اصلی -->
    <div id="main-screen" style="display: none;">
        <header>
            <h1>مدیریت چت پلاس</h1>
            <button onclick="logout()" style="background: none; border: none; color: var(--red); cursor: pointer;">خروج</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" id="tab-users-btn" onclick="switchTab('users')">کاربران</button>
            <button class="tab-btn" id="tab-reports-btn" onclick="switchTab('reports')">گزارش‌ها</button>
        </div>

        <div class="section active" id="users-section">
            <div id="users-list"></div>
        </div>

        <div class="section" id="reports-section">
            <div id="reports-list"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dznjirjgxqfkdulriqxy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_U4RPxsx_VUcldfgyH46Npw_Xp1xfiol';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const ADMIN_PASSWORD = '11111';

        let allUsers = [];
        let allReports = [];
        let currentTab = 'users';

        function login() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'block';
                loadData();
            } else {
                alert('رمز اشتباه است!');
            }
        }

        function logout() {
            location.reload();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('users-section').classList.toggle('active', tab === 'users');
            document.getElementById('reports-section').classList.toggle('active', tab === 'reports');
            document.getElementById('tab-users-btn').classList.toggle('active', tab === 'users');
            document.getElementById('tab-reports-btn').classList.toggle('active', tab === 'reports');
        }

        async function loadData() {
            // گرفتن کاربران
            const { data: users } = await sb.from('users').select('*');
            if (users) allUsers = users;
            
            // گرفتن گزارش‌ها
            const { data: reports } = await sb.from('reports').select('*').order('created_at', { ascending: false });
            if (reports) allReports = reports;

            renderUsers();
            renderReports();
        }

        function getInitial(name) { return (name || '?').charAt(0).toUpperCase(); }

        function renderUsers() {
            const list = document.getElementById('users-list');
            if (!allUsers.length) { list.innerHTML = '<p style="text-align:center; padding:20px;">کاربری یافت نشد</p>'; return; }

            list.innerHTML = allUsers.map(u => {
                const av = u.avatar_url 
                    ? `<div class="avatar" style="background-image:url('${u.avatar_url}')"></div>`
                    : `<div class="avatar">${getInitial(u.display_name)}</div>`;
                
                return `
                <div class="row-card">
                    <div class="user-header">
                        ${av}
                        <div class="user-info">
                            <h3>${u.display_name} ${u.is_verified ? '✅' : ''} ${u.is_banned ? '🚫' : ''}</h3>
                            <p>@${u.username}</p>
                        </div>
                    </div>
                    <div class="actions">
                        <button onclick="toggleVerify('${u.id}', ${!u.is_verified})" class="${u.is_verified ? 'danger' : 'green'}">${u.is_verified ? 'حذف تیک' : 'تایید'}</button>
                        <button onclick="toggleBan('${u.id}', ${!u.is_banned})" class="${u.is_banned ? 'green' : 'danger'}">${u.is_banned ? 'رفع مسدودی' : 'مسدود'}</button>
                        <button class="danger" onclick="deleteUser('${u.id}')">حذف</button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderReports() {
            const list = document.getElementById('reports-list');
            if (!allReports.length) { list.innerHTML = '<p style="text-align:center; padding:20px;">گزارشی یافت نشد</p>'; return; }

            list.innerHTML = allReports.map(r => {
                // پیدا کردن اسم گزارش دهنده و کسی که گزارش شده
                const reporter = allUsers.find(u => u.id === r.reporter_id);
                const reported = allUsers.find(u => u.id === r.reported_user_id);
                
                const reporterName = reporter ? reporter.display_name : 'کاربر ناشناس';
                const reportedName = reported ? reported.display_name : 'کل برنامه (گزارش عمومی)';

                return `
                <div class="report-card">
                    <div class="report-names">
                        <span style="color: var(--primary);">${reporterName}</span> 
                        گزارش داد 
                        <span style="color: var(--red);">${reportedName}</span>
                    </div>
                    <div class="report-reason">دلیل: ${r.reason}</div>
                    <div class="report-time">${new Date(r.created_at).toLocaleString('fa-IR')}</div>
                    <button class="danger" style="margin-top:10px; width:100%; padding:8px; border-radius:8px;" onclick="deleteReport('${r.id}')">حذف گزارش</button>
                </div>`;
            }).join('');
        }

        // عملیات روی کاربران
        async function toggleVerify(id, val) { await sb.from('users').update({ is_verified: val }).eq('id', id); loadData(); }
        async function toggleBan(id, val) { await sb.from('users').update({ is_banned: val }).eq('id', id); loadData(); }
        async function deleteUser(id) {
            if (!confirm('مطمئنی؟ کاربر و پیام‌هایش حذف می‌شوند!')) return;
            await sb.from('messages').delete().eq('user_id', id);
            await sb.from('pv_messages').delete().or(`sender_id.eq.${id},receiver_id.eq.${id}`);
            await sb.from('users').delete().eq('id', id);
            loadData();
        }
        async function deleteReport(id) { await sb.from('reports').delete().eq('id', id); loadData(); }
    </script>
</body>
</html>
